services:
  bot:
    container_name: cerberus-bot
    build:
      context: .
      target: development
    env_file:
      - .env
    environment:
      POSTGRES_DSN: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/code

  admin:
    container_name: cerberus-admin
    build:
      context: .
      target: development
    env_file:
      - .env
    environment:
      POSTGRES_DSN: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/code
    command: [ "-m", "uvicorn", "admin:app", "--port", "8000", "--host", "0.0.0.0" ]
    ports:
      - "${ADMIN_PORT:-8000}:8000"

  db:
    image: postgres:18.3
    container_name: cerberus-db
    env_file:
      - .env
    ports:
      - "${POSTGRES_EXTERNAL_PORT:-5432}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      retries: 5
      start_period: 10s
      timeout: 10s
    networks:
      - internal
    volumes:
      - pgdata:/var/lib/postgresql

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
    driver: local
